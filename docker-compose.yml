services:
  tw-quant-db:
    image: postgres:16-alpine
    container_name: tw-quant-db
    hostname: tw-quant-db
    environment:
      POSTGRES_USER: twquant
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
      POSTGRES_DB: twquant_shared
    volumes:
      - ./pg_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    secrets:
      - pg_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twquant -d twquant_shared"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tw-quant-network
    restart: unless-stopped

  # One-shot backfill service for core.daily_prices (auto 7d on up)
  # Requires tw-quant-mcp running separately (tw-quant-mcp/docker-compose.yml)
  # and shared network tw-quant-network (docker network create tw-quant-network)
  tw-quant-backfill:
    build:
      context: .
      dockerfile: Dockerfile.backfill
    image: tw-quant-backfill:latest
    container_name: tw-quant-backfill
    hostname: tw-quant-backfill
    environment:
      - DATABASE_URL=postgresql://twquant:${POSTGRES_PASSWORD}@tw-quant-db:5432/twquant_shared?sslmode=disable
      - MCP_HOST=http://tw-quant-mcp:8888
      - TWSE_MCP_URL=https://TW-Stock-MCP-Server.fastmcp.app/mcp
      - FINMIND_API_KEY=${FINMIND_TOKEN:-}
      - FINMIND_TOKEN=${FINMIND_TOKEN:-}
      - BACKFILL_ALL_LISTED=true
      - STOCK_IDS=
      - STOCKS_FILE=
    command: ["--range", "7d"]
    volumes:
      - ./backfill_data:/app/data
    depends_on:
      tw-quant-db:
        condition: service_healthy
    networks:
      - tw-quant-network
    restart: "no"
  # HTTP API server for backfill (for pickup scheduler T048)
  tw-quant-backfill-api:
    build:
      context: .
      dockerfile: Dockerfile.backfill
    image: tw-quant-backfill:latest
    container_name: tw-quant-backfill-api
    hostname: tw-quant-backfill-api
    environment:
      - DATABASE_URL=postgresql://twquant:${POSTGRES_PASSWORD}@tw-quant-db:5432/twquant_shared?sslmode=disable
      - MCP_HOST=http://tw-quant-mcp:8888
      - TWSE_MCP_URL=https://TW-Stock-MCP-Server.fastmcp.app/mcp
      - FINMIND_API_KEY=${FINMIND_TOKEN:-}
      - FINMIND_TOKEN=${FINMIND_TOKEN:-}
      - BACKFILL_ALL_LISTED=true
    command: ["--mode=server", "--port=8080"]
    ports:
      - "8080:8080"
    volumes:
      - ./backfill_data:/app/data
    depends_on:
      tw-quant-db:
        condition: service_healthy
    networks:
      - tw-quant-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # pgAdmin for schema/DB inspection
  tw-quant-pgadmin:
    image: dpage/pgadmin4:latest
    container_name: tw-quant-pgadmin
    hostname: tw-quant-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@twquant.internal
      PGADMIN_DEFAULT_PASSWORD_FILE: /run/secrets/pgadmin_password
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGPASS_FILE: /run/secrets/pgpass
    secrets:
      - pgadmin_password
      - pgpass
    ports:
      - "8001:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./scripts/pgadmin_servers.json:/pgadmin4/servers.json:ro
    depends_on:
      tw-quant-db:
        condition: service_healthy
    networks:
      - tw-quant-network
    restart: unless-stopped

volumes:
  pgadmin_data:

networks:
  tw-quant-network:
    name: tw-quant-network
    external: true

secrets:
  pg_password:
    file: ./secrets/postgres_password.txt
  pgadmin_password:
    file: ./secrets/pgadmin_password.txt
  pgpass:
    file: ./secrets/pgpass
