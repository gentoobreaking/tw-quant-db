version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: twquant-shared-postgres
    volumes:
      - ./pg_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    secrets:
      - pg_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twquant -d twquant_shared"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tw-quant-network
    restart: unless-stopped

  # pgAdmin for schema/DB inspection
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: twquant-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@twquant.internal
      PGADMIN_DEFAULT_PASSWORD_FILE: /run/secrets/pgadmin_password
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGPASS_FILE: /run/secrets/pgpass
    secrets:
      - pgadmin_password
      - pgpass
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./scripts/pgadmin_servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tw-quant-network
    restart: unless-stopped

volumes:
  pgadmin_data:

networks:
  tw-quant-network:
    driver: bridge

secrets:
  pg_password:
    file: ./secrets/postgres_password.txt
  pgadmin_password:
    file: ./secrets/pgadmin_password.txt
  pgpass:
    file: ./secrets/pgpass
