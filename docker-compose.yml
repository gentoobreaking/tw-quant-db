version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: twquant-shared-postgres
    environment:
      POSTGRES_USER: twquant
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
      POSTGRES_DB: twquant_shared
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    secrets:
      - pg_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twquant"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # pgAdmin for schema/DB inspection
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: twquant-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@twquant.local
      PGADMIN_DEFAULT_PASSWORD_FILE: /run/secrets/pgadmin_password
    secrets:
      - pgadmin_password
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  pg_data:
  pgadmin_data:

secrets:
  pg_password:
    file: ./secrets/postgres_password.txt
  pgadmin_password:
    file: ./secrets/pgadmin_password.txt
